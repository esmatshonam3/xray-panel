# =============================================================================
#  Railway — سرویس پنل (Control Plane)
#
#  ⚠️  مهم: این فایل فقط وقتی خوانده می‌شود که Root Directory سرویس روی
#      «panel» تنظیم شده باشد.
#
#      Settings → Source → Root Directory = panel
#
#      اگر Root Directory روی «/» (ریشه‌ی مخزن) بماند، Railway این فایل را
#      نمی‌بیند، با Railpack از ریشه بیلد می‌کند و با این خطا شکست می‌خورد:
#
#          ⚠ Script start.sh not found
#          ✖ Railpack could not determine how to build the app.
#
#      چون مخزن یک monorepo است و هیچ requirements.txt یا package.json
#      در ریشه وجود ندارد.
#
#  ⚠️  Config as Code منسوخ شده است و تا ۲۰۲۶-۱۲-۰۱ کار می‌کند.
#      برای مسیر آینده فایل .railway/railway.ts را ببینید.
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["app/**", "requirements.txt", "Dockerfile", "entrypoint.sh"]

[deploy]
# healthcheck باید ۲۰۰ برگرداند وگرنه Railway دیپلوی را رد می‌کند
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
startCommand = "bash entrypoint.sh"

# -----------------------------------------------------------------------------
#  متغیرهای محیطی موردنیاز (در تب Variables سرویس تنظیم کنید)
#
#  DATABASE_URL            = ${{Postgres.DATABASE_URL}}        ← از پلاگین Postgres
#  PANEL_BASE_URL          = https://${{RAILWAY_PUBLIC_DOMAIN}}
#  LIVE_PROXY_ENABLED      = true
#  CORS_ORIGINS            = https://${{RAILWAY_PUBLIC_DOMAIN}}
#  SECRET_KEY              = <64 کاراکتر تصادفی>
#  ENCRYPTION_KEY          = <کلید Fernet>
#  SUPERADMIN_PASSWORD     = <رمز قوی>
#  TELEGRAM_BOT_TOKEN      = <از BotFather>
#  TELEGRAM_BOT_USERNAME   = <نام ربات بدون @>
#  TELEGRAM_WEBHOOK_SECRET = <رشته تصادفی>
#  TELEGRAM_ADMIN_IDS      = <آیدی عددی ادمین‌ها، جدا شده با کاما>
#  ENABLE_SCHEDULER        = true
#  WEB_CONCURRENCY         = 1
#
#  نکته: Railway فقط HTTP/HTTPS را روی $PORT منتشر می‌کند؛ اینباندهای Xray
#  (که به TCP/UDP خام نیاز دارند) باید روی سرویس node-agent جداگانه اجرا شوند.
# -----------------------------------------------------------------------------
